<!doctype html>
<notebook theme="midnight">
  <title>Uchaf</title>
  <script id="2" type="text/markdown" hidden="">
    # Uchaf
  </script>
  <script id="1" type="text/html">
    <div id="field"></div>
  </script>
  <script id="3" type="module">
    // The player's configuration is the notebook's: config.json is
    // the config that scoring-uchaf.html measured and exported
    // (createConfig fills in anything an older export lacks). Its
    // fade time is the old name spelFadeMs (1500), read as fadeMs
    // because charFades is false; typeCss turns it into --fade-in
    // and --fade-out. Player-only overrides would go in the second
    // argument.
    const { createConfig } = await import("scoringthespeltair")
    const config = createConfig(await FileAttachment("./data/config.json").json())
  </script>
  <script id="4" type="text/html">
    <style>
      /* This page's look. Colours override the midnight theme's.
         They are set on body, not :root: the theme stylesheet is
         injected after the template's and would win a
         same-specificity :root rule. The deep blue is the
         original page's background. */
      body {
        --theme-background: #001f3f;
        --theme-foreground: floralwhite;
        cursor: none;
      }

      /* The type (family, size, weight, line height, ligatures,
         optical size) and the fade times (--fade-in, --fade-out,
         --field-fade) come from the config through the engine's
         typeCss: the type the notebook measured the spels in. */
      ${typeCss(config, "#field")}

      #field {
        /* typeCss now names 'Source Serif 4 Variable' (the font
           custom.tmpl bundles) before 'Source Serif 4', so this
           line only repeats it. */
        font-family: 'Source Serif 4 Variable', 'Source Serif 4', serif;
        position: absolute;
        /* The first spel lands where the original's did (29px
           down at 1200px wide): the kit already puts the field
           17px below the top. */
        top: 1vw;
        /* Centred on the extent of its spels (both verses): see
           centerField in the engine. */
        left: calc((100% - var(--extent-w, 0vw)) / 2 - var(--extent-x, 0vw));
        user-select: none;
        -webkit-user-select: none; /* Safari */
      }

      .spel {
        position: absolute;
        opacity: 0;
        transition: all var(--fade-out, 1.3s) ease-in-out;
      }

      .spel.visible {
        opacity: 1;
        transition: all var(--fade-in, 1.3s) ease-in-out;
      }

      /* With charFades each spel is split into .char spans, which
         carry the fade (here charFades is false). */
      .char {
        opacity: 0;
        transition: all var(--fade-out, 1.3s) ease-in-out;
      }

      .char.visible {
        opacity: 1;
        transition: all var(--fade-in, 1.3s) ease-in-out;
      }
    </style>
  </script>
  <script id="5" type="module">
    const { typeCss } = await import("scoringthespeltair")
  </script>
  <script id="6" type="module">
    // Wait for the DOM to be ready before querying elements
    await new Promise((resolve) => requestAnimationFrame(resolve));

    // --- DEBUG configuration
    // config.startPara = 2; // DEBUG
    // config.running = false; // DEBUG
    const fieldElem = document.getElementById("field");
    // --- preprocessing ---
    const spels = new Map(await FileAttachment("./data/spels.json").json());
    const paras = await FileAttachment("./data/paras.json").json();
    // the sequence of scores: arrays of items, and the names of
    // generators (see data/generators.js)
    const scores = await FileAttachment("./data/scores.json").json();
    const measuredWith = await FileAttachment("./data/measured.json").json();
    const { play, mount } = await import("scoringthespeltair");
    const { generators } = await import("./data/generators.js");
    // puts the spels in the field (character by character if
    // config.charFades), warns if the type differs from what they
    // were measured in, and centres the field on their extent
    mount(config, fieldElem, { spels, measuredWith });
    if (config.running) play(config, fieldElem, spels, paras, scores, { generators });
  </script>
</notebook>
