<!doctype html>
<notebook theme="midnight">
  <title>Uchaf</title>
  <script id="2" type="text/markdown" hidden="">
    # Uchaf
  </script>
  <script id="1" type="text/html">
    <div id="field"></div>
  </script>
  <script id="3" type="module">
    // The player's configuration is the notebook's: config.json is the config that scoring-uchaf.html
    // measured and exported (createConfig fills in anything an older export lacks). Player-only
    // overrides would go in the second argument.
    const { createConfig } = await import("scoringthespeltair")
    const config = createConfig(await FileAttachment("./data/config.json").json())
  </script>
  <script id="4" type="text/html">
    <style>
      /* this page's look: colours override the midnight theme's, set on body (not :root) because the
         theme stylesheet is injected after the template's and would win a same-specificity :root
         override. (The deep blue is the original page's background.) */
      body {
        --theme-background: #001f3f;
        --theme-foreground: floralwhite;
        cursor: none;
      }

      /* the type (family, size, weight, line height, ligatures, optical size) and the fade times
         (--spel-fade, --char-fade, --field-fade) come from the config, through the engine's typeCss:
         the same type the notebook measured the spels in */
      ${typeCss(config, "#field")}

      #field {
        /* typeCss names 'Source Serif 4', which is only a font the viewer has installed. The one custom.tmpl
           bundles (fontsource) is registered as 'Source Serif 4 Variable', so name that first: the same
           font, with the same weight and optical-size axes, wherever the page is viewed. (Engine v0.6.0; typeCss
           in the engine after it names both, and this line can then go.) */
        font-family: 'Source Serif 4 Variable', 'Source Serif 4', serif;
        position: absolute;
        top: 1vw; /* the first spel lands where the original's did (29px down at 1200px wide): the kit puts the field 17px below the top already */
        /* centred on the extent of its spels (both verses); see centerField in scoringthespeltair */
        left: calc((100% - var(--extent-w, 0vw)) / 2 - var(--extent-x, 0vw));
        user-select: none;
        -webkit-user-select: none; /* Safari */
      }

      .spel {
        position: absolute;
        opacity: 0;
        transition: all var(--spel-fade) ease-in-out;
      }

      .spel.visible {
        opacity: 1;
      }

      /* with charFades each spel is split into .char spans, which carry the fade (Uchaf: charFades is false) */
      .char {
        opacity: 0;
        transition: all var(--char-fade) ease-in-out;
      }

      .char.visible {
        opacity: 1;
      }
    </style>
  </script>
  <script id="5" type="module">
    const { typeCss } = await import("scoringthespeltair")
  </script>
  <script id="6" type="module">
    // Wait for the DOM to be ready before querying elements
    await new Promise((resolve) => requestAnimationFrame(resolve));

    // --- DEBUG configuration
    // config.startPara = 2; // DEBUG
    // config.running = false; // DEBUG
    const fieldElem = document.getElementById("field");
    // --- preprocessing ---
    const spels = new Map(await FileAttachment("./data/spels.json").json());
    const paras = await FileAttachment("./data/paras.json").json();
    // the sequence of scores: arrays of items, and the names of generators (see data/generators.js)
    const scores = await FileAttachment("./data/scores.json").json();
    const measuredWith = await FileAttachment("./data/measured.json").json();
    const { play, mount } = await import("scoringthespeltair");
    const { generators } = await import("./data/generators.js");
    // puts the spels in the field (character by character if config.charFades), warns if the type
    // differs from what they were measured in, and centres the field on their extent
    mount(config, fieldElem, { spels, measuredWith });
    if (config.running) play(config, fieldElem, spels, paras, scores, { generators });
  </script>
</notebook>
